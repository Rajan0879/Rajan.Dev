<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Background Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Brand Typography: R with Red Dot -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 17 26 L 11 32 L 17 38" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letter R -->
    <text x="31" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>

    <!-- Right Bracket /> -->
    <path d="M 47 26 L 53 32 L 47 38" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Red Dot -->
  <circle cx="39" cy="38" r="2.5" fill="#ef4444" filter="url(#glow)"/>
</svg>
